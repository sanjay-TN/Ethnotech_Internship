<!doctype html>
<html>
  <head>
    <title>Chat App - Login</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body class="bg-light">
    <div
      class="container d-flex justify-content-center align-items-center vh-100"
    >
      <div class="card p-4 shadow" style="width: 400px">
        <h3 class="text-center mb-3">Chat App</h3>

        <!-- Tabs -->
        <ul class="nav nav-tabs">
          <li class="nav-item">
            <button class="nav-link active" onclick="showLogin()">Login</button>
          </li>
          <li class="nav-item">
            <button class="nav-link" onclick="showRegister()">Register</button>
          </li>
        </ul>

        <!-- Login Form -->
        <div id="loginForm" class="mt-3">
          <input
            type="email"
            id="loginEmail"
            class="form-control mb-2"
            placeholder="Enter your email"
          />
          <input
            type="password"
            id="loginPassword"
            class="form-control mb-2"
            placeholder="Enter your password"
          />

          <button class="btn btn-primary w-100" onclick="login()">Login</button>
        </div>

        <!-- Register Form -->
        <div id="registerForm" class="mt-3 d-none">
          <input
            type="text"
            id="username"
            class="form-control mb-2"
            placeholder="Choose username"
          />
          <input
            type="email"
            id="email"
            class="form-control mb-2"
            placeholder="Enter email"
          />
          <input
            type="password"
            id="password"
            class="form-control mb-2"
            placeholder="Create password"
          />

          <button class="btn btn-success w-100" onclick="register()">
            Register
          </button>
        </div>

        <p class="text-center text-muted mt-3" style="font-size: 12px">
          Tip: Register first, then login to access chat
        </p>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <!-- <script src="js/auth.js"></script> -->
  </body>
</html>
