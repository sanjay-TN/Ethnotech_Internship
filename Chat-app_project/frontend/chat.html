<!doctype html>
<html>
  <head>
    <title>Chat App</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #e5ddd5;
      }

      .sidebar {
        height: 100vh;
        background: #ffffff;
        border-right: 1px solid #ddd;
        overflow-y: auto;
      }

      .chat-area {
        height: 100vh;
        display: flex;
        flex-direction: column;
      }

      .chat-header {
        padding: 15px;
        background: #075e54;
        color: white;
        display: flex;
        justify-content: space-between;
      }

      .messages {
        flex: 1;
        overflow-y: auto;
        padding: 15px;
      }

      .message {
        max-width: 60%;
        padding: 10px;
        margin: 8px;
        border-radius: 10px;
      }

      .sent {
        background: #dcf8c6;
        margin-left: auto;
      }

      .received {
        background: white;
      }

      .timestamp {
        font-size: 10px;
        color: gray;
        text-align: right;
      }

      .input-area {
        padding: 10px;
        background: white;
      }

      .user-item {
        padding: 12px;
        cursor: pointer;
        border-bottom: 1px solid #f0f0f0;
      }

      .user-item:hover {
        background: #f5f5f5;
      }

      .typing {
        font-size: 12px;
        color: gray;
        padding-left: 15px;
      }

      .section-title {
        padding: 10px;
        font-size: 13px;
        color: gray;
      }

      .online-dot {
        color: green;
        font-size: 10px;
        margin-left: 5px;
      }
    </style>
  </head>

  <body>
    <div class="container-fluid">
      <div class="row">
        <!-- 🔹 Sidebar -->
        <div class="col-3 sidebar">
          <h5 class="p-3">💬 Chats</h5>

          <!-- Instruction -->
          <p class="px-3 text-muted" style="font-size: 12px">
            Select a user or group to start chatting
          </p>

          <!-- Users -->
          <div class="section-title">Users</div>
          <div id="userList"></div>

          <hr />

          <!-- Groups -->
          <div class="section-title">Groups</div>
          <div id="groupList"></div>

          <div class="p-3">
            <button
              class="btn btn-success w-100 mb-2"
              onclick="createGroupPrompt()"
            >
              + Create Group
            </button>
            <button class="btn btn-danger w-100" onclick="logout()">
              Logout
            </button>
          </div>
        </div>

        <!-- 🔹 Chat Area -->
        <div class="col-9 chat-area">
          <!-- Header -->
          <div class="chat-header">
            <span id="chatWith">Select a chat</span>
            <span id="userEmail"></span>
          </div>

          <!-- Messages -->
          <div id="messages" class="messages"></div>

          <!-- Typing Indicator -->
          <div id="typingIndicator" class="typing"></div>

          <!-- Input -->
          <div class="input-area">
            <div class="input-group">
              <input
                type="text"
                id="messageInput"
                class="form-control"
                placeholder="Type a message..."
                oninput="sendTyping()"
              />

              <button class="btn btn-success" onclick="sendMessage()">
                Send
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 🔹 Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs/lib/stomp.min.js"></script>

    <!-- 🔹 Scripts -->
    <script src="js/websocket.js"></script>
    <script src="js/chat.js"></script>

    <!-- 🔹 Show Logged User -->
    <script>
      document.getElementById("userEmail").innerText =
        localStorage.getItem("email");
    </script>
  </body>
</html>
