<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expenses | AI Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="expenses">
    <div class="app-shell">
        <aside class="sidebar">
            <a class="sidebar-brand" href="dashboard.html"><span class="brand-mark">AI</span><span>Expense Tracker</span></a>
            <nav class="nav-list">
                <a href="dashboard.html">Dashboard</a>
                <a class="active" href="expenses.html">Expenses</a>
                <a href="reports.html">Reports</a>
            </nav>
            <button id="logoutBtn" class="ghost-btn">Logout</button>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div>
                    <p class="eyebrow">Transactions</p>
                    <h1>Expense Management</h1>
                </div>
                <button id="themeToggle" class="theme-toggle" type="button">Light</button>
            </header>

            <section class="expense-layout reveal">
                <article class="glass-card">
                    <div class="section-heading">
                        <h2 id="expenseFormTitle">Add Transaction</h2>
                        <button id="resetExpenseForm" class="small-btn" type="button">Clear</button>
                    </div>
                    <form id="expenseForm" class="form-stack compact-form" novalidate>
                        <input type="hidden" id="expenseId">
                        <label>
                            Title
                            <input type="text" id="title" placeholder="Groceries" required>
                        </label>
                        <label>
                            Amount
                            <input type="number" id="amount" min="0.01" step="0.01" placeholder="1200" required>
                        </label>
                        <label>
                            Type
                            <select id="transactionType" required>
                                <option value="EXPENSE">Expense</option>
                                <option value="INCOME">Income</option>
                            </select>
                        </label>
                        <label>
                            Category
                            <select id="category" required></select>
                        </label>
                        <label>
                            Date
                            <input type="date" id="expenseDate" required>
                        </label>
                        <label>
                            Note
                            <textarea id="note" rows="3" placeholder="Optional details"></textarea>
                        </label>
                        <button class="primary-btn" type="submit">Save Transaction</button>
                    </form>
                </article>

                <article class="glass-card">
                    <div class="section-heading">
                        <h2>All Transactions</h2>
                        <span id="expenseCount">0 items</span>
                    </div>
                    <form id="filterForm" class="filter-grid" novalidate>
                        <input type="search" id="query" placeholder="Search">
                        <select id="filterCategory">
                            <option value="">All categories</option>
                        </select>
                        <select id="filterType">
                            <option value="">All types</option>
                            <option value="EXPENSE">Expense</option>
                            <option value="INCOME">Income</option>
                        </select>
                        <input type="date" id="fromDate">
                        <input type="date" id="toDate">
                        <input type="number" id="minAmount" placeholder="Min">
                        <input type="number" id="maxAmount" placeholder="Max">
                        <button class="small-btn" type="submit">Filter</button>
                    </form>
                    <div class="table-wrap">
                        <table>
                            <thead>
                                <tr>
                                    <th>Title</th>
                                    <th>Category</th>
                                    <th>Type</th>
                                    <th>Date</th>
                                    <th>Amount</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="expenseTable"></tbody>
                        </table>
                    </div>
                </article>
            </section>
        </main>
    </div>
    <div id="toastHost" class="toast-host"></div>
    <script src="script.js"></script>
</body>
</html>
