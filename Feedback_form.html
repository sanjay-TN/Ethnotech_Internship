<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Feedback Form</title>
  </head>
  <body>
    <div class="container">
      <h1>Product Feedback Form</h1>

      <form id="feedbackForm">
        <!-- Personal Information -->
        <div class="form-group">
          <label for="name">Full Name <span class="required">*</span></label>
          <input
            type="text"
            id="name"
            name="name"
            required
            placeholder="Enter your full name"
          />
          <div class="error-message" id="nameError"></div>
        </div>

        <div class="form-group">
          <label for="email"
            >Email Address <span class="required">*</span></label
          >
          <input
            type="email"
            id="email"
            name="email"
            required
            placeholder="example@email.com"
          />
          <div class="error-message" id="emailError"></div>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="text" id="phone" name="phone" placeholder="(Optional)" />
        </div>

        <!-- Product Selection -->
        <div class="form-group">
          <label for="product">Product <span class="required">*</span></label>
          <select id="product" name="product" required>
            <option value="">-- Select a Product --</option>
            <option value="product1">Product A - Premium Edition</option>
            <option value="product2">Product B - Standard Edition</option>
            <option value="product3">Product C - Basic Edition</option>
            <option value="service">Our Services</option>
            <option value="other">Other</option>
          </select>
          <div class="error-message" id="productError"></div>
        </div>

        <!-- Overall Rating -->
        <div class="form-group">
          <label>Overall Satisfaction <span class="required">*</span></label>
          <div class="rating-container">
            <div class="rating-option">
              <input
                type="radio"
                id="rating1"
                name="rating"
                value="1"
                required
              />
              <label for="rating1" class="rating-option label">1 - Poor</label>
            </div>
            <div class="rating-option">
              <input type="radio" id="rating2" name="rating" value="2" />
              <label for="rating2" class="rating-option label">2 - Fair</label>
            </div>
            <div class="rating-option">
              <input type="radio" id="rating3" name="rating" value="3" />
              <label for="rating3" class="rating-option label">3 - Good</label>
            </div>
            <div class="rating-option">
              <input type="radio" id="rating4" name="rating" value="4" />
              <label for="rating4" class="rating-option label"
                >4 - Very Good</label
              >
            </div>
            <div class="rating-option">
              <input type="radio" id="rating5" name="rating" value="5" />
              <label for="rating5" class="rating-option label"
                >5 - Excellent</label
              >
            </div>
          </div>
          <div class="error-message" id="ratingError"></div>
        </div>

        <!-- Categories -->
        <div class="form-group">
          <label>Feedback Categories (Select all that apply)</label>
          <div class="checkbox-group">
            <div class="checkbox-group">
              <input
                type="checkbox"
                id="quality"
                name="category"
                value="quality"
              />
              <label for="quality" class="checkbox-label">Quality</label>
            </div>
            <div class="checkbox-group">
              <input type="checkbox" id="price" name="category" value="price" />
              <label for="price" class="checkbox-label">Price</label>
            </div>
            <div class="checkbox-group">
              <input
                type="checkbox"
                id="support"
                name="category"
                value="support"
              />
              <label for="support" class="checkbox-label">Support</label>
            </div>
            <div class="checkbox-group">
              <input
                type="checkbox"
                id="delivery"
                name="category"
                value="delivery"
              />
              <label for="delivery" class="checkbox-label">Delivery</label>
            </div>
          </div>
        </div>

        <!-- Detailed Feedback -->
        <div class="form-group">
          <label for="feedback"
            >Detailed Feedback <span class="required">*</span></label
          >
          <textarea
            id="feedback"
            name="feedback"
            required
            placeholder="Please share your thoughts, suggestions, or concerns..."
          ></textarea>
          <div class="error-message" id="feedbackError"></div>
        </div>

        <!-- Recommendation -->
        <div class="form-group">
          <label
            >Would you recommend us to others?
            <span class="required">*</span></label
          >
          <div class="radio-group">
            <div class="radio-group">
              <input
                type="radio"
                id="recommend-yes"
                name="recommend"
                value="yes"
                required
              />
              <label for="recommend-yes" class="radio-label"
                >Yes, definitely</label
              >
            </div>
            <div class="radio-group">
              <input
                type="radio"
                id="recommend-maybe"
                name="recommend"
                value="maybe"
              />
              <label for="recommend-maybe" class="radio-label">Maybe</label>
            </div>
            <div class="radio-group">
              <input
                type="radio"
                id="recommend-no"
                name="recommend"
                value="no"
              />
              <label for="recommend-no" class="radio-label">No</label>
            </div>
          </div>
          <div class="error-message" id="recommendError"></div>
        </div>

        <!-- Consent -->
        <div class="form-group">
          <div class="checkbox-group">
            <input
              type="checkbox"
              id="consent"
              name="consent"
              value="yes"
              required
            />
            <label for="consent" class="checkbox-label"
              >I agree to allow this company to contact me regarding this
              feedback <span class="required">*</span></label
            >
          </div>
          <div class="error-message" id="consentError"></div>
        </div>

        <!-- Buttons -->
        <div class="button-group">
          <button type="submit" class="submit-btn">Submit Feedback</button>
          <button type="reset" class="reset-btn">Clear Form</button>
        </div>
      </form>
    </div>
  </body>
</html>
