      rel="stylesheet"
    />
  </head>
  <body>
    <!-- 🔥 NAVBAR -->
    <nav class="navbar navbar-dark bg-dark">
      <div class="container-fluid">
        <span class="navbar-brand">Leaderboard</span>

          <button class="btn btn-danger" onclick="logout()">Logout</button>
